    <circle cx="842" cy="38" r="1.2" fill="#fff"/>
    <circle cx="412" cy="64" r="1.4" fill="#fff"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="600" cy="184" r="104" fill="url(#sun)"/>
  </g>
  <g clip-path="url(#sunClip)" opacity="0.82">
