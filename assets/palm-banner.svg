<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">palm neon cyber beach banner</title>
  <desc id="desc">A neon 1980s Miami inspired sunset with palm silhouettes, synthwave grid, and the palm CLI name.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#16002d"/>
      <stop offset="0.38" stop-color="#3b0a5f"/>
      <stop offset="0.74" stop-color="#ff2c91"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="0.42" stop-color="#ff7ab6"/>
      <stop offset="1" stop-color="#7417ff"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.38" stop-color="#8dfcff"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#ff5bd7"/>
      <stop offset="1" stop-color="#7b2cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sunClip">
      <circle cx="600" cy="184" r="104"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="30" fill="#120022"/>
  <rect x="10" y="10" width="1180" height="400" rx="24" fill="url(#sky)"/>

  <g opacity="0.45">
    <circle cx="112" cy="78" r="1.8" fill="#fff"/>
