name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build release artifacts
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: palm_linux_amd64
          - goos: linux
            goarch: arm64
            artifact: palm_linux_arm64
          - goos: darwin
            goarch: amd64
            artifact: palm_darwin_amd64
          - goos: darwin
            goarch: arm64
            artifact: palm_darwin_arm64
          - goos: windows
            goarch: amd64
            artifact: palm_windows_amd64.exe
          - goos: windows
            goarch: arm64
            artifact: palm_windows_arm64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${VERSION#v}" -o "dist/${{ matrix.artifact }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify version matches tag
        run: |
          chmod +x dist/palm_linux_amd64
          got="$(dist/palm_linux_amd64 -version)"
          want="palm ${GITHUB_REF_NAME#v}"
          if [ "$got" != "$want" ]; then
            echo "version mismatch: got '$got', want '$want'" >&2
            exit 1
          fi

      - name: Create checksums
        run: |
          cd dist
          sha256sum palm_* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
