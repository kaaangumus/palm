name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o palm .

  installer-scripts:
    name: Installer scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell syntax (install.sh)
        run: sh -n install.sh

      - name: PowerShell syntax (install.ps1)
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$errors
          )
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'install.ps1 sozdizimi OK'

      - name: install.ps1 must stay ASCII without BOM
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Join-Path $PWD 'install.ps1'))
          if ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
            Write-Error 'install.ps1 BOM icermemeli: "irm | iex" BOM u ilk komutun parcasi sanip hata basar.'
            exit 1
          }
          $nonAscii = $bytes | Where-Object { $_ -gt 0x7F }
          if ($nonAscii) {
            Write-Error 'install.ps1 ASCII disi karakter iceriyor; Windows PowerShell 5.1 bunu bozar.'
            exit 1
          }
          Write-Host 'install.ps1 ASCII + BOM yok: OK'
